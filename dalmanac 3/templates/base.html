<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Dalmanac{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="cabecalho">
        <a class="logo" href="{{ url_for('jogo.inicio') if session.get('usuario_id') else url_for('usuario.login') }}">DALMANAC</a>
        {% if session.get('usuario_id') %}
            <nav>
                <span>Olá, {{ session.get('usuario_nome') }}</span>
                <a href="{{ url_for('jogo.inicio') }}">Biblioteca</a>
                <a href="{{ url_for('usuario.sair') }}">Sair</a>
            </nav>
        {% endif %}
    </header>

    <main class="conteudo">
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="mensagem {{ categoria }}">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}

        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
